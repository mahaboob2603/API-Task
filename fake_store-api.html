<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Search Product By ID</h1>
    <img src="" alt="Product Image" id="productImage" style="height: 100px;">
    <h2 id="productTitle"></h2>
    <h3 id="productDescription"></h3>
    <h3 id="price"></h3>
    <input type="number" id="num" placeholder="Enter a number">
    
    <button onclick="check()">Check</button>
    <script>
        async function check() {
            let data = await fetch(`https://fakestoreapi.com/products/${document.getElementById("num").value}`)
                .then(res => res.json())
                .then(json => {
                    console.log(json);
                    document.getElementById("productImage").src = json.image;
                    document.getElementById("productTitle").textContent = json.title;
                    document.getElementById("productDescription").textContent = json.description;
                    document.getElementById("price").textContent = `$${json.price.toFixed(2)}`;
                });
        }
    </script>
</body>
</html>
