<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input[type="text"] { width: 70%; padding: 8px; font-size: 15px; }
    button { padding: 8px 14px; font-size: 15px; cursor: pointer; }
    #taskList div { display: flex; align-items: center; gap: 10px; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
    .done { text-decoration: line-through; opacity: 0.5; }
    .del-btn { color: red; border: none; background: none; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>My Tasks</h2>

  <!-- INPUT AREA -->
  <input type="text" id="taskInput" placeholder="Add a new task..." />
  <button onclick="addTask()">Add</button>

  <!-- TASK LIST -->
  <div id="taskList"></div>

  <script>
    // =============================
    // STEP 1 — The Data (tasks array)
    // =============================
    let tasks = [];

    // =============================
    // STEP 2 — render() : Draw tasks on screen
    // =============================
    function render() {
      const list = document.getElementById('taskList');  // find the container
      list.innerHTML = '';                                // clear it completely

      // loop through every task and create HTML for it
      tasks.forEach(function(task) {

        // create a <div> for this task row
        const row = document.createElement('div');

        // create the checkbox
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.onchange = function() {
          toggleTask(task.id);   // called when user clicks checkbox
        };

        // create the task label text
        const label = document.createElement('span');
        label.textContent = task.text;
        if (task.done) {
          label.className = 'done';  // strikethrough style
        }

        // create the delete button
        const delBtn = document.createElement('button');
        delBtn.textContent = '🗑';
        delBtn.className = 'del-btn';
        delBtn.onclick = function() {
          deleteTask(task.id);   // called when user clicks delete
        };

        // attach checkbox, label, delete button inside the row
        row.appendChild(checkbox);
        row.appendChild(label);
        row.appendChild(delBtn);

        // attach the row inside the task list container
        list.appendChild(row);
      });
    }

    // =============================
    // STEP 3 — addTask() : Add a new task
    // =============================
    function addTask() {
      const input = document.getElementById('taskInput'); // get the input box
      const text = input.value.trim();                    // read what user typed

      if (text === '') return;  // do nothing if empty

      // create a new task object and push into array
      tasks.push({
        id: Date.now(),  // unique id using current timestamp
        text: text,
        done: false
      });

      input.value = '';  // clear the input box
      render();          // redraw the list
    }

    // =============================
    // STEP 4 — toggleTask() : Check / Uncheck a task
    // =============================
    function toggleTask(id) {
      tasks = tasks.map(function(task) {
        if (task.id === id) {
          task.done = !task.done;  // flip true->false or false->true
        }
        return task;
      });
      render();  // redraw
    }

    // =============================
    // STEP 5 — deleteTask() : Remove a task
    // =============================
    function deleteTask(id) {
      tasks = tasks.filter(function(task) {
        return task.id !== id;  // keep all tasks EXCEPT the one being deleted
      });
      render();  // redraw
    }

    // =============================
    // STEP 6 — Press Enter to add task
    // =============================
    document.getElementById('taskInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

  </script>

</body>
</html>
