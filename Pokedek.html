<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokédex</title>
  <style>
    /* ── Google Font for that pixel/retro feel ── */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'VT323', monospace;
    }

    /* ══════════════════════════════
       OUTER POKÉDEX SHELL
    ══════════════════════════════ */
    .pokedex {
      display: flex;
      background: #cc0000;
      border-radius: 16px;
      box-shadow:
        0 0 40px rgba(0,0,0,0.8),
        inset 0 2px 4px rgba(255,255,255,0.2),
        0 0 80px rgba(204,0,0,0.15);
      width: 780px;
      min-height: 480px;
      position: relative;
      border: 3px solid #880000;
      transition: box-shadow 0.3s ease;
    }

    .pokedex:hover {
      box-shadow:
        0 0 50px rgba(0,0,0,0.9),
        inset 0 2px 4px rgba(255,255,255,0.2),
        0 0 100px rgba(204,0,0,0.25);
    }

    /* hinge in the middle */
    .pokedex::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: 10px;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, #880000, #660000, #880000);
      z-index: 10;
    }

    /* ══════════════════════════════
       LEFT PANEL
    ══════════════════════════════ */
    .left-panel {
      flex: 1;
      padding: 18px 16px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 16px 0 0 16px;
    }

    /* top decorations: big circle + indicator dots */
    .top-deco {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .big-circle {
      width: 52px; height: 52px;
      background: radial-gradient(circle at 35% 35%, #60d0f0, #0080b0);
      border-radius: 50%;
      border: 4px solid white;
      box-shadow: 0 0 12px rgba(0,180,255,0.6), 0 0 24px rgba(0,180,255,0.2);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(0,180,255,0.6), 0 0 24px rgba(0,180,255,0.2); }
      50% { box-shadow: 0 0 18px rgba(0,180,255,0.9), 0 0 36px rgba(0,180,255,0.4); }
    }
    .dots { display: flex; gap: 6px; }
    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    .dot:hover { transform: scale(1.2); }
    .dot.red   { background: #ff4444; box-shadow: 0 0 6px rgba(255,68,68,0.4); }
    .dot.yellow{ background: #ffdd00; box-shadow: 0 0 6px rgba(255,221,0,0.4); }
    .dot.green { background: #44ff44; box-shadow: 0 0 6px rgba(68,255,68,0.4); }

    /* ── MAIN SCREEN (left) ── */
    .main-screen {
      background: #1a1a2a;
      border: 4px solid #444;
      border-radius: 6px;
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 240px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    /* tab bar inside screen */
    .screen-tabs {
      display: flex;
      gap: 4px;
    }
    .screen-tabs span {
      background: #2a5fa8;
      color: #aaddff;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }
    .screen-tabs span:hover {
      background: #3a6fb8;
      transform: translateY(-1px);
    }
    .screen-tabs span.active { background: #4488dd; color: white; }

    /* pokemon display area */
    .poke-display {
      display: flex;
      gap: 10px;
      flex: 1;
    }

    /* sprite box */
    .sprite-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
    }
    .sprite-box img {
      width: 80px; height: 80px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 6px rgba(100,200,255,0.5));
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .sprite-box img:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 12px rgba(100,200,255,0.8));
    }
    .poke-number {
      color: #88aaff;
      font-size: 10px;
      font-family: 'Press Start 2P', monospace;
      margin-top: 4px;
    }
    .poke-name-screen {
      color: #ffffff;
      font-size: 11px;
      font-family: 'Press Start 2P', monospace;
    }
    .poke-category {
      color: #aaaaaa;
      font-size: 9px;
      font-family: 'Press Start 2P', monospace;
    }

    /* info panel inside screen */
    .info-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .info-label {
      color: #ffdd44;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
    }
    .info-value {
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      color: white;
      font-weight: bold;
      margin-right: 4px;
      text-transform: uppercase;
      transition: transform 0.2s ease;
    }
    .type-badge:hover { transform: scale(1.1); }

    /* type colors */
    .type-fire     { background: #f08030; }
    .type-water    { background: #6890f0; }
    .type-grass    { background: #78c850; }
    .type-electric { background: #f8d030; color: #333; }
    .type-psychic  { background: #f85888; }
    .type-ice      { background: #98d8d8; color: #333; }
    .type-dragon   { background: #7038f8; }
    .type-dark     { background: #705848; }
    .type-fighting { background: #c03028; }
    .type-poison   { background: #a040a0; }
    .type-ground   { background: #e0c068; color: #333; }
    .type-flying   { background: #a890f0; }
    .type-bug      { background: #a8b820; }
    .type-rock     { background: #b8a038; }
    .type-ghost    { background: #705898; }
    .type-steel    { background: #b8b8d0; color: #333; }
    .type-normal   { background: #a8a878; }
    .type-fairy    { background: #ee99ac; }

    .stars { color: #ffdd44; font-size: 14px; }

    /* stat bars */
    .stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .stat-name {
      color: #aaffaa;
      width: 60px;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
    }
    .stat-bar-bg {
      flex: 1;
      background: #333;
      height: 7px;
      border-radius: 3px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(to right, #44ff88, #00cc55);
      transition: width 0.6s ease;
    }
    .stat-val {
      color: #ffffff;
      font-size: 11px;
      width: 28px;
      text-align: right;
    }

    /* bottom status bar (like the green LCD) */
    .status-bar {
      background: linear-gradient(to bottom, #55bb55, #44aa44);
      border: 2px solid #228822;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      color: #003300;
      font-family: 'VT323', monospace;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
    }

    /* search bar area */
    .search-area {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .search-area input {
      flex: 1;
      background: #222;
      color: #00ff88;
      border: 2px solid #444;
      border-radius: 4px;
      padding: 5px 8px;
      font-family: 'VT323', monospace;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-area input:focus {
      border-color: #6688ff;
      box-shadow: 0 0 8px rgba(102,136,255,0.3);
    }
    .search-area input::placeholder { color: #555; }

    .btn-search {
      background: #cc0000;
      color: white;
      border: 2px solid #880000;
      border-radius: 50%;
      width: 34px; height: 34px;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-search:hover {
      background: #ff2222;
      transform: scale(1.1);
    }
    .btn-search:active { transform: scale(0.95); }

    /* D-pad */
    .controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 18px);
      grid-template-rows: repeat(3, 18px);
      gap: 1px;
    }
    .dpad div {
      background: #222;
      border-radius: 2px;
      transition: background 0.15s;
    }
    .dpad div:hover { background: #333; }
    .dpad .center { background: #111; }

    /* ══════════════════════════════
       RIGHT PANEL
    ══════════════════════════════ */
    .right-panel {
      flex: 1;
      padding: 18px 18px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 0 16px 16px 0;
    }

    /* flavour text / description screen */
    .desc-screen {
      background: #000;
      border: 4px solid #444;
      border-radius: 6px;
      padding: 10px;
      min-height: 90px;
      font-family: 'VT323', monospace;
      font-size: 17px;
      color: #dddddd;
      line-height: 1.4;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    /* ability/move grid (the blue squares) */
    .grid-screen {
      background: #4488cc;
      border: 4px solid #2255aa;
      border-radius: 6px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      min-height: 90px;
    }
    .grid-cell {
      background: #6aacee;
      border: 2px solid #3377bb;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'VT323', monospace;
      font-size: 13px;
      color: white;
      text-align: center;
      padding: 4px;
      min-height: 36px;
      transition: background 0.2s, transform 0.1s;
    }
    .grid-cell:hover {
      background: #7abcff;
      transform: translateY(-1px);
    }

    /* right side buttons */
    .right-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-small {
      width: 30px; height: 14px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }
    .btn-small:hover { transform: scale(1.1); filter: brightness(1.2); }
    .btn-small:active { transform: scale(0.95); }
    .btn-small.red   { background: #ff4444; }
    .btn-small.green { background: #44dd44; }
    .btn-big {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #ffcc00, #ffaa00);
      border: 3px solid #cc7700;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-big:hover { transform: scale(1.08); }
    .btn-big:active { transform: scale(0.95); }
    .btn-white {
      width: 28px; height: 28px;
      background: white;
      border: 2px solid #aaa;
      border-radius: 3px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-white:hover { transform: scale(1.08); }
    .btn-white:active { transform: scale(0.95); }

    /* type label bar at bottom right */
    .type-bar {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .type-label-box {
      background: #111;
      border: 2px solid #444;
      border-radius: 4px;
      padding: 4px 12px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      color: #aaffaa;
      flex: 1;
      text-align: center;
      transition: color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .type-label-box.active {
      color: #ffdd44;
      border-color: #ffdd44;
      box-shadow: 0 0 8px rgba(255,221,68,0.2);
    }

    /* ── EMPTY / LOADING state ── */
    .placeholder-text {
      color: #555;
      font-size: 13px;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      margin-top: 20px;
      line-height: 1.8;
    }
    .error-text {
      color: #ff4444;
      font-size: 13px;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      margin-top: 20px;
    }

    /* ── Loading animation ── */
    .loading-text {
      color: #88aaff;
      font-size: 11px;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      margin-top: 30px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

<div class="pokedex">

  <!-- ══════ LEFT PANEL ══════ -->
  <div class="left-panel">

    <!-- Top decorations -->
    <div class="top-deco">
      <div class="big-circle"></div>
      <div class="dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
    </div>

    <!-- Main screen -->
    <div class="main-screen">
      <!-- Tab bar -->
      <div class="screen-tabs">
        <span class="active">Stats</span>
        <span>Location</span>
        <span>Evolution</span>
        <span>Moves</span>
        <span>Cry</span>
      </div>

      <!-- Pokemon display -->
      <div class="poke-display" id="leftDisplay">
        <div class="placeholder-text">ENTER A<br>POKÉMON<br>NAME</div>
      </div>
    </div>

    <!-- Search area -->
    <div class="search-area">
      <input id="pokiname" placeholder="pikachu, squirtle..." />
      <button class="btn-search" onclick="pokidata()">▶</button>
    </div>

    <!-- Bottom status bar -->
    <div class="status-bar" id="statusBar">
      Ready. Enter Pokémon name above.
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="dpad">
        <div></div><div></div><div></div>
        <div></div><div class="center"></div><div></div>
        <div></div><div></div><div></div>
      </div>
    </div>

  </div>

  <!-- ══════ RIGHT PANEL ══════ -->
  <div class="right-panel">

    <!-- Description screen -->
    <div class="desc-screen" id="descScreen">
      Pokédex description will<br>appear here...
    </div>

    <!-- Abilities / moves grid -->
    <div class="grid-screen" id="gridScreen">
      <!-- filled dynamically -->
    </div>

    <!-- Right buttons -->
    <div class="right-buttons">
      <button class="btn-small red"></button>
      <button class="btn-small green"></button>
      <button class="btn-big"></button>
      <button class="btn-white"></button>
      <button class="btn-white"></button>
    </div>

    <!-- Type label bar -->
    <div class="type-bar">
      <div class="type-label-box" id="typeBar">—</div>
      <div class="type-label-box" id="typeBar2">—</div>
    </div>

  </div>

</div>

<script>
  // ── Helper: capitalize "thunder-punch" → "Thunder Punch" ──
  function capitalize(str) {
    return str.split("-").map(function(w) {
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }

  // ── Helper: update status bar ──
  function setStatus(msg) {
    document.getElementById("statusBar").textContent = msg;
  }

  // ── The main function ──
  async function pokidata() {

    // 1. Get the name from input, trim spaces, lowercase
    var nameInput = document.getElementById("pokiname").value.trim().toLowerCase();

    if (!nameInput) {
      setStatus("⚠ Please enter a Pokémon name!");
      return;
    }

    setStatus("Searching for " + nameInput + "...");

    // Show loading state on left display
    document.getElementById("leftDisplay").innerHTML =
      '<div class="loading-text">LOADING...</div>';

    try {
      // 2. Fetch Pokémon base data
      var response = await fetch("https://pokeapi.co/api/v2/pokemon/" + nameInput);

      if (!response.ok) {
        throw new Error("Pokémon not found!");
      }

      var data = await response.json();

      // 3. Fetch species data for the Pokédex description
      var speciesResponse = await fetch(data.species.url);
      var speciesData = await speciesResponse.json();

      // 4. Now update the UI
      renderLeft(data, speciesData);
      renderRight(data, speciesData);

      // Build status text
      var genusText = "Pokémon";
      if (speciesData.genera) {
        for (var i = 0; i < speciesData.genera.length; i++) {
          if (speciesData.genera[i].language.name === "en") {
            genusText = speciesData.genera[i].genus;
            break;
          }
        }
      }
      var idPadded = "#" + String(data.id).padStart(3, "0");
      setStatus(idPadded + " " + data.name.toUpperCase() + " — " + genusText);

    } catch (err) {
      // Show error on screen
      document.getElementById("leftDisplay").innerHTML =
        '<div class="error-text">NOT FOUND!<br><br>Check the<br>name again.</div>';
      document.getElementById("descScreen").textContent = "No data found.";
      document.getElementById("gridScreen").innerHTML = "";
      document.getElementById("typeBar").textContent = "—";
      document.getElementById("typeBar").className = "type-label-box";
      document.getElementById("typeBar2").textContent = "—";
      document.getElementById("typeBar2").className = "type-label-box";
      setStatus("⚠ Error: " + err.message);
    }
  }

  // ── Render LEFT panel: sprite + type + physical data + stats ──
  function renderLeft(data, speciesData) {

    // sprite
    var sprite = data.sprites.front_default;

    // types e.g. ["water"] or ["fire","flying"]
    var types = data.types.map(function(t) { return t.type.name; });

    // height & weight (API gives decimetres and hectograms)
    var heightFt = (data.height * 0.328084).toFixed(1);
    var weightLbs = (data.weight * 0.220462).toFixed(1);

    // abilities
    var abilities = data.abilities.map(function(a) {
      return "• " + capitalize(a.ability.name) + (a.is_hidden ? " (Hidden)" : "");
    });

    // rarity stars (based on base_experience — simple heuristic)
    var exp = data.base_experience || 0;
    var starCount = exp < 100 ? 2 : exp < 180 ? 3 : exp < 250 ? 4 : 5;
    var stars = "";
    for (var s = 0; s < 5; s++) {
      stars += s < starCount ? "★" : "☆";
    }

    // stats for bar chart
    var stats = data.stats.map(function(s) {
      return {
        name: s.stat.name.replace("special-", "sp.").toUpperCase(),
        value: s.base_stat
      };
    });

    // type badge HTML
    var typeBadges = types.map(function(t) {
      return '<span class="type-badge type-' + t + '">' + t + '</span>';
    }).join("");

    // stat bars HTML
    var statBarsHTML = "";
    for (var i = 0; i < stats.length; i++) {
      var pct = Math.min(stats[i].value / 200 * 100, 100);
      // color based on value
      var barColor;
      if (stats[i].value < 50) barColor = "#ff4444";
      else if (stats[i].value < 80) barColor = "#f4a261";
      else if (stats[i].value < 120) barColor = "#44ff88";
      else barColor = "#00cc55";

      statBarsHTML += '<div class="stat-row">' +
        '<div class="stat-name">' + stats[i].name + '</div>' +
        '<div class="stat-bar-bg"><div class="stat-bar-fill" style="width:' + pct + '%;background:linear-gradient(to right,' + barColor + ',' + barColor + ')"></div></div>' +
        '<div class="stat-val">' + stats[i].value + '</div>' +
        '</div>';
    }

    // Build the left display HTML
    document.getElementById("leftDisplay").innerHTML =
      '<div class="sprite-box">' +
        '<img src="' + sprite + '" alt="' + data.name + '" />' +
        '<div class="poke-number">#' + String(data.id).padStart(3, "0") + '</div>' +
        '<div class="poke-name-screen">' + capitalize(data.name) + '</div>' +
      '</div>' +
      '<div class="info-panel">' +
        '<div>' +
          '<span class="info-label">TYPE</span><br/>' +
          typeBadges +
        '</div>' +
        '<div>' +
          '<span class="info-label">HT / WT</span>' +
          '<div class="info-value">' + heightFt + ' ft / ' + weightLbs + ' lbs</div>' +
        '</div>' +
        '<div>' +
          '<span class="info-label">RARITY</span>' +
          '<div class="stars">' + stars + '</div>' +
        '</div>' +
        statBarsHTML +
      '</div>';
  }

  // ── Render RIGHT panel: description + moves grid + type bar ──
  function renderRight(data, speciesData) {

    // Pokédex description (English flavour text)
    var description = "No description available.";
    if (speciesData.flavor_text_entries) {
      for (var i = 0; i < speciesData.flavor_text_entries.length; i++) {
        if (speciesData.flavor_text_entries[i].language.name === "en") {
          description = speciesData.flavor_text_entries[i].flavor_text.replace(/\f/g, " ").replace(/\n/g, " ");
          break;
        }
      }
    }

    document.getElementById("descScreen").textContent = description;

    // Moves — show first 9
    var movesHTML = "";
    var maxMoves = Math.min(data.moves.length, 9);
    for (var i = 0; i < maxMoves; i++) {
      movesHTML += '<div class="grid-cell">' + capitalize(data.moves[i].move.name) + '</div>';
    }
    document.getElementById("gridScreen").innerHTML = movesHTML;

    // Type label bar (show up to 2 types)
    var type1 = data.types[0] ? data.types[0].type.name.toUpperCase() : "—";
    var type2 = data.types[1] ? data.types[1].type.name.toUpperCase() : "—";

    document.getElementById("typeBar").textContent = type1;
    document.getElementById("typeBar").className = "type-label-box active";
    document.getElementById("typeBar2").textContent = type2;
    document.getElementById("typeBar2").className = "type-label-box" + (data.types[1] ? " active" : "");
  }

  // Allow pressing Enter to search
  document.getElementById("pokiname").addEventListener("keydown", function(e) {
    if (e.key === "Enter") pokidata();
  });
</script>
